<!DOCTYPE html>
<html>
<head>
    <title>Catch Me!</title>
    <style>
        #catchButton {
            position: absolute;
            top: 300px;
            left: 250px;
        }

        #revealAttackButton
        {
            position: absolute;
            top: 600px;
            left: 20px;
        }
    </style>
</head>
<body>
    <iframe id="Iframe" src="./portal.html" style="opacity: 0; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; margin: 0; padding: 0; z-index: 0;"></iframe>
    <h1>Catch Me!</h1>
    <p>Score: <span id="score">0</span></p>
    
    
    <button id="catchButton" onclick="changeButtonPosition()">Catch Me</button>
    <button onclick="revealAttackButton()" style="position: relative; z-index: 10;">Reveal Attack</button>
    <script>
       function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


function revealAttackButton() {
    var frame = document.getElementById("Iframe");
    frame.style.opacity = "1";
}
function changeButtonPosition() {
    var scoreElement = document.getElementById("score");
    var currentScore = parseInt(scoreElement.textContent) + 1;
    scoreElement.textContent = currentScore;

    var button = document.getElementById("catchButton");
    var frame = document.getElementById("Iframe");

    if (currentScore !== 4) {
        button.style.left = getRandomInt(50, 400) + "px";
        button.style.top = getRandomInt(50, 400) + "px";
    } else {
        button.style.left = "250px";
        button.style.top = "100px";
        frame.style.zIndex = "2";
    }
}
    </script>
</body>
</html>
